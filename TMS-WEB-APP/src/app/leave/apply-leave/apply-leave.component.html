<h2 mat-dialog-title class="dialog-header">
  Apply Leave
</h2>

<mat-dialog-content class="sheet">
  <form [formGroup]="form" (ngSubmit)="submit()" class="leave-form">

    <!-- Leave Type -->
    <mat-form-field appearance="outline" class="field">
      <mat-label>Leave Type*</mat-label>
      <mat-select formControlName="leaveType" required>
        <mat-option value="Sick">Sick</mat-option>
        <mat-option value="Casual">Casual / Vacation</mat-option>
        <mat-option value="Emergency">Emergency</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('leaveType')?.hasError('required')">
        Leave type is required
      </mat-error>
    </mat-form-field>

    <div class="date-row">
      <!-- Start Date -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Start Date</mat-label>
        <input
          matInput
          [matDatepicker]="p1"
          [min]="minDate"
          formControlName="startDate"
          placeholder="Select start date"
          required
        />
        <mat-datepicker-toggle matSuffix [for]="p1"></mat-datepicker-toggle>
        <mat-datepicker #p1></mat-datepicker>
        <mat-error *ngIf="form.get('startDate')?.hasError('required')">
          Start date is required
        </mat-error>
      </mat-form-field>

      <!-- End Date -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>End Date</mat-label>
        <input
          matInput
          [matDatepicker]="p2"
          [min]="form.get('startDate')?.value || minDate"
          [max]="getMaxEndDate()"
          formControlName="endDate"
          placeholder="Select end date"
          required
        />
        <mat-datepicker-toggle matSuffix [for]="p2"></mat-datepicker-toggle>
        <mat-datepicker #p2></mat-datepicker>
        <mat-error *ngIf="form.get('endDate')?.hasError('required')">
          End date is required
        </mat-error>
        <mat-error *ngIf="form.get('endDate')?.hasError('maxDateExceeded')">
          End date cannot be more than 7 days after the start date.
        </mat-error>
      </mat-form-field>


      <!-- Duration (read only) -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Duration</mat-label>
        <input matInput [value]="durationDays" readonly aria-label="Duration in working days" />
        <mat-hint align="end">days</mat-hint>
      </mat-form-field>
    </div>

    <!-- Reason -->
    <mat-form-field appearance="outline" class="field">
      <mat-label>Reason*</mat-label>
      <textarea
        matInput
        rows="6"
        formControlName="reason"
        maxlength="100"
        placeholder="Describe the reason"
        required
      ></textarea>
      <mat-hint align="end">{{ (form.get('reason')?.value?.length || 0) }}/100</mat-hint>
      <mat-error *ngIf="form.get('reason')?.hasError('required')">
        Reason is required
      </mat-error>
    </mat-form-field>


  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-footer">
  <button mat-raised-button type="button" class="btn-blue" (click)="cancel()">Cancel</button>
  <button
    mat-raised-button
    class=".btn-blue"
    color="primary"
    (click)="submit()"
    [disabled]="form.invalid || durationDays <= 0"
  >
    Apply
  </button>
</mat-dialog-actions>
